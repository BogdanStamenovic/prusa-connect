[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prusa-connect"
version = "0.1.0"
description = "Headless command-line client for Prusa Connect: printer status, files, history, and guarded print control."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bogdan Stamenovic" }]
keywords = ["prusa", "prusa-connect", "3d-printing", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<3",
]

[project.scripts]
prusa-connect = "prusa_connect.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/prusa_connect"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
